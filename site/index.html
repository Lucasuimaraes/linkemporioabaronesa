  <style>
    :root {
      color-scheme: dark;
      --black: #070707;
      --panel: #0d0c09;
      --gold: #f4c542;
      --gold-dark: #b88617;
      --cream: #fff7df;
      --muted: rgba(255, 247, 223, .67);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--black); }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      color: var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(244, 197, 66, .20), transparent 36rem),
        radial-gradient(circle at 100% 100%, rgba(184, 134, 11, .10), transparent 30rem),
        var(--black);
    }

    main {
      width: min(100%, 500px);
      padding: 26px clamp(18px, 5vw, 30px) 22px;
      border: 1px solid rgba(244, 197, 66, .32);
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(22, 19, 12, .97), rgba(4, 4, 4, .99));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .62), inset 0 1px 0 rgba(255, 255, 255, .04);
      text-align: center;
    }

    .logo {
      display: block;
      width: min(56vw, 220px);
      height: auto;
      margin: 0 auto 10px;
      border-radius: 50%;
      filter: drop-shadow(0 12px 28px rgba(244, 197, 66, .12));
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font: 500 clamp(1.65rem, 7vw, 2.3rem)/1.08 Georgia, "Times New Roman", serif;
      letter-spacing: .035em;
    }

    .intro {
      margin: 10px auto 18px;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.5;
    }

    .links { display: grid; gap: 11px; }

    .link {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 15px;
      border: 1px solid rgba(244, 197, 66, .48);
      border-radius: 16px;
      color: var(--cream);
      background: rgba(255, 255, 255, .025);
      text-align: left;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: rgba(244, 197, 66, .08);
    }

    .link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #171006;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    }

    .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .copy { min-width: 0; }
    .copy strong, .copy small { display: block; }
    .copy strong { font-size: 1rem; line-height: 1.25; }
    .copy small { margin-top: 3px; color: var(--muted); font-size: .78rem; line-height: 1.35; }
    footer { margin-top: 17px; color: rgba(255, 247, 223, .42); font-size: .72rem; }

    @media (max-height: 740px) {
      body { place-items: start center; }
      .logo { width: 150px; }
      main { padding-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
  </style>
